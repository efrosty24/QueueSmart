server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown paths to index.html so client routes like /register work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Built assets have hashed filenames, so they can be cached long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
