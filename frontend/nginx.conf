server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: send unknown paths to index.html so client routes like /register work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls go to the FastAPI container from docker-compose.yml. Docker's DNS
    # (127.0.0.11) resolves "backend" per request, so nginx still starts if the
    # frontend image runs on its own (API calls then return 502).
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built assets have hashed filenames, so they can be cached long-term.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
